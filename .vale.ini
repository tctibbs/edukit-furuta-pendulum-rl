# House style and the tells of generated prose. No third-party package. NegativeParallelism
# removed: 126 corpus hits, none true.
StylesPath = .vale/styles
MinAlertLevel = suggestion

Vocab = Furuta

[*.md]
BasedOnStyles = Furuta
# Present tense is an experiment-report rule; decision records read correctly in past tense.
Furuta.PastTenseNarration = NO

[docs/experiments/*/writeup.md]
BasedOnStyles = Furuta
Furuta.PastTenseNarration = warning
