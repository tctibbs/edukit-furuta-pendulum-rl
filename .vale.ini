# House style and the tells of generated prose. NegativeParallelism removed: 126 corpus
# hits, none true.
#
# Google is the upstream package (MIT, errata-ai/Google), synced by `just vale-sync` and
# not committed. It is taken whole and then trimmed below: of its 36 rules, 15 fire on
# this corpus and only Spelling is a true catch. The rest are register disagreements, so
# they are turned off with the reason recorded. The 20 that stay silent are kept armed.
StylesPath = .vale/styles
MinAlertLevel = suggestion

Packages = Google
Vocab = Furuta

[*.md]
BasedOnStyles = Furuta, Google
# Present tense is an experiment-report rule; decision records read correctly in past tense.
Furuta.PastTenseNarration = NO

# Prose this project writes on purpose.
Google.Parens = NO             # 96 hits, all manual citations: "(Manual App. D, page 148)"
Google.Passive = NO            # 89 hits; passive is correct when the actor is the apparatus
Google.Acronyms = NO           # 79 hits: PID, LQR, PhysX, USD, all defined on first use
Google.Semicolons = NO         # 11 hits, all joining two related clauses
Google.Will = NO               # 9 hits; "this experiment will check them" is genuinely future

# Direct conflicts with the house style.
Google.Contractions = NO       # wants "don't" over "do not"; this project writes it out
Google.OxfordComma = NO        # 23 hits; the house style does not use it
Google.Colons = NO             # wants "ADR-0002: train on..." after the colon
Google.Headings = NO           # wants "Milestone 05: balance"; milestone titles are proper
Google.WordListCase = NO       # wants "preceding" for "above"
Google.EmDash = NO             # normalises the spaces around a dash; pre-commit bans dashes
Google.Timeless = NO           # subset of Furuta.TimeAnchored

# Technical vocabulary this rule cannot tell from a claim.
Google.ExcessiveClaims = NO    # "where the pendulum moves fastest"; "the best case" latency
Google.Anthropomorphism = NO   # "each PID loop sees one angle" is the control-engineering term
Google.Ordinal = NO            # wants "ninety-fifth percentile" for "95th"
Google.Ranges = NO             # 1 hit, false

[docs/experiments/*/writeup.md]
BasedOnStyles = Furuta, Google
Furuta.PastTenseNarration = warning
