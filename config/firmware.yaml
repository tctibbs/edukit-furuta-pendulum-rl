# Firmware images that can be written to the Edukit board.
#
# A target needs a path and a description. Everything else is optional and falls back to
# `defaults`.
#
#   path         where the .bin lives, relative to the repository root
#   description  one line, shown by `just hw-targets`
#   banner       text the firmware prints on boot, used to confirm the right image is
#                running. Omit it when the image does not announce itself.
#   build_id     the identifier this build prints after `BUILD ` at startup, set by
#                FIRMWARE_BUILD in edukit_system.h. Only images built from this
#                project carry one. Reading it back identifies the flashed image.
#   flash_base   overrides the default, for a part with a different memory map
#   flash_size   overrides the default
#
# Images under `docs/reference/` are third-party and git-ignored. Repopulate them with
# `just docs-fetch`.

default: edukit

defaults:
  # STM32F401RE. Both values come from the part.
  flash_base: 0x08000000
  flash_size: 0x80000

targets:
  edukit:
    path: docs/reference/Edukit_firmware.bin
    description: Stock ST and UCLA Edukit firmware, the pendulum controller
    banner: System Starting Prepare to Enter Mode Selection

  instrumented:
    path: build/firmware/edukit-swingup-tuned.bin
    description: Retuned swing-up plus per-impulse reporting, rebuilt from the firmware source. See the runbook
    banner: System Starting Prepare to Enter Mode Selection

  bench:
    path: build/firmware/edukit-bench.bin
    description: Bench instrumentation. Retuned swing-up, mode w free-swing logger, mode y tilt sweep
    build_id: bench
    banner: System Starting Prepare to Enter Mode Selection

  # The mode is compile-time (IDENT_AUTOSTART_MODE), so each probe is a separate build
  # that boots straight into it. The rebuild recipe and the make caveat are in the
  # firmware runbook.
  ident-sweep:
    path: build/firmware/edukit-ident-sweep.bin
    description: Autostart 'y', boots probe-sweep (baseplate tilt). Drives the motor slowly through a full turn
    build_id: ident
    banner: System Starting Prepare to Enter Mode Selection

  ident-pump:
    path: build/firmware/edukit-ident-pump.bin
    description: Autostart 'd', boots probe-pump (ring-down across amplitude, plus counts-per-rev). Drives the motor
    build_id: ident
    banner: System Starting Prepare to Enter Mode Selection

  ident-lean:
    path: build/firmware/edukit-ident-lean.bin
    description: Autostart 'a', boots probe-lean (actuator units, authority, and the min-command ladder). Drives the motor; run supervised
    build_id: ident
    banner: System Starting Prepare to Enter Mode Selection

  ident-trace:
    path: build/firmware/edukit-ident-trace.bin
    description: Autostart 'u', boots probe-trace (the stock swing-up and balance, logged, ten times). Drives the motor; run supervised
    build_id: ident
    banner: System Starting Prepare to Enter Mode Selection

  # The hardware test for [Milestone 05](../docs/milestones/M5-balance.md): the stock
  # swing-up hands over to the exported RL policy (board/, see
  # docs/runbooks/model-conversion.md) instead of the PID loops. Drives the motor and
  # holds for up to 30 s; run supervised with a hand on the supply.
  rl-balance:
    path: build/firmware/edukit-rl-balance.bin
    description: Autostart 'b', the stock swing-up then the RL balance policy in place of the PID. Drives the motor; run supervised
    build_id: rl
    banner: System Starting Prepare to Enter Mode Selection

  # The policies that have run on the machine, kept so any can be reflashed without a
  # rebuild. All are mode b; they differ in the checkpoint compiled into them and in
  # RL_ACCEL_BOUND_RAD_S2, which must match the bound the checkpoint trained with.
  # Rebuild one from its checkpoint under docs/experiments/05-balance/checkpoints/ with
  # `just board-export <checkpoint> --no-squash-actions` and the bound set in the
  # firmware header.
  rl-balance-a60:
    path: build/firmware/edukit-rl-balance-a60.bin
    description: Autostart 'b' at 60 rad/s^2, momentum_a60_seed1. Holds 30 s but sweeps the arm through turns. Drives the motor; run supervised
    build_id: rl
    banner: System Starting Prepare to Enter Mode Selection

  rl-balance-a60b:
    path: build/firmware/edukit-rl-balance-a60b.bin
    description: Autostart 'b' at 60 rad/s^2, momentum_a60b_seed1, trained with the charge on arm travel restored. Drives the motor; run supervised
    build_id: rl
    banner: System Starting Prepare to Enter Mode Selection

  rl-balance-a60c:
    path: build/firmware/edukit-rl-balance-a60c.bin
    description: Autostart 'b' at 60 rad/s^2, momentum_a60c_seed1, charged for both the arm's position and its speed. Drives the motor; run supervised
    build_id: rl
    banner: System Starting Prepare to Enter Mode Selection

  rl-balance-a60d:
    path: build/firmware/edukit-rl-balance-a60d.bin
    description: Autostart 'b' at 60 rad/s^2, momentum_a60d_seed1, the same charges with the action-rate weight raised from 0.01 to 0.5. Drives the motor; run supervised
    build_id: rl
    banner: System Starting Prepare to Enter Mode Selection

  # The swing-up test, mode r. Rebuild it from a checkpoint under
  # docs/experiments/06-swing-up/checkpoints/ with `just board-export <checkpoint>
  # --squash-actions` and RL_ACCEL_BOUND_RAD_S2 at 60 in the firmware header.
  rl-swingup:
    path: build/firmware/edukit-rl-swingup.bin
    description: Autostart 'r' at 60 rad/s^2, swingup_r7_smooth_seed2, the RL swing-up policy from rest with the arm returned to its start after each attempt. Drives the arm fast; run supervised
    build_id: rl
    banner: System Starting Prepare to Enter Mode Selection
