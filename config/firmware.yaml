# Firmware images that can be written to the Edukit board.
#
# Adding a target is an edit to this file. A target needs a path and a description.
# Everything else is optional and falls back to `defaults`.
#
#   path         where the .bin lives, relative to the repository root
#   description  one line, shown by `just hw-targets`
#   banner       text the firmware prints on boot, used to confirm the right image is
#                running. Omit it when the image does not announce itself.
#   build_id     the identifier this build prints after `BUILD ` at startup, set by
#                FIRMWARE_BUILD in edukit_system.h. Only images built from this
#                project carry one.
#   flash_base   overrides the default, for a part with a different memory map
#   flash_size   overrides the default
#
# Images under `docs/reference/` are third-party and git-ignored. Repopulate them with
# `just docs-fetch`.

default: edukit

defaults:
  # STM32F401RE. Both values come from the part.
  flash_base: 0x08000000
  flash_size: 0x80000

targets:
  edukit:
    path: docs/reference/Edukit_firmware.bin
    description: Stock ST and UCLA Edukit firmware, the pendulum controller
    banner: System Starting Prepare to Enter Mode Selection

  instrumented:
    path: build/firmware/edukit-swingup-tuned.bin
    description: Retuned swing-up plus per-impulse reporting, rebuilt from the firmware source. See the runbook
    banner: System Starting Prepare to Enter Mode Selection

  bench:
    path: build/firmware/edukit-bench.bin
    description: Bench instrumentation. Retuned swing-up, mode w free-swing logger, mode y tilt sweep
    # `build_id` is the string after `BUILD ` in the startup banner, so the board can be
    # asked what it runs. Stock images carry no such string.
    build_id: bench
    banner: System Starting Prepare to Enter Mode Selection

  # The mode is compile-time (IDENT_AUTOSTART_MODE), so each probe is a separate build
  # that boots straight into it. The rebuild recipe and the make caveat are in the
  # firmware runbook. Flash one, capture, then the next.
  ident-sweep:
    path: build/firmware/edukit-ident-sweep.bin
    description: Autostart 'y', boots probe-sweep (baseplate tilt). Drives the motor slowly through a full turn
    build_id: ident
    banner: System Starting Prepare to Enter Mode Selection

  ident-pump:
    path: build/firmware/edukit-ident-pump.bin
    description: Autostart 'd', boots probe-pump (ring-down across amplitude, plus counts-per-rev). Drives the motor
    build_id: ident
    banner: System Starting Prepare to Enter Mode Selection

  ident-lean:
    path: build/firmware/edukit-ident-lean.bin
    description: Autostart 'a', boots probe-lean (actuator units, authority, and the min-command ladder). Drives the motor; run supervised
    build_id: ident
    banner: System Starting Prepare to Enter Mode Selection

  ident-trace:
    path: build/firmware/edukit-ident-trace.bin
    description: Autostart 'u', boots probe-trace (the stock swing-up and balance, logged, ten times). Drives the motor; run supervised
    build_id: ident
    banner: System Starting Prepare to Enter Mode Selection
