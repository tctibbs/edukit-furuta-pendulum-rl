# Physical and interface parameters for the STEVAL-EDUKIT01 rotary inverted pendulum.
#
# The simulation reads its physical constants from this file. Every value here is the
# manual's nominal for the kit as designed. Nothing has been measured on this unit.

geometry:
  pendulum_length_m: 0.258      # L, from the manual, App. D, Pendulum Dynamics, page 148
  rotor_arm_length_m: 0.140     # r, full arm, from the manual, Table 2, page 11. App. D page 148 prints 0.141 for the same symbol
  pendulum_mass_kg: 0.050       # m, assumed. The manual does not give it; it cancels in the linear model but not in the torque budget
  gravity_m_s2: 9.806           # From the manual, App. D, Pendulum Dynamics, page 148. Not the standard 9.80665

dynamics:
  normalized_shaft_inertia: 0.0139   # 2*I_shaft/(m*L^2), from the manual, App. D, page 148
  quality_factor: 20.0               # Q of the suspended oscillation, from the manual, App. D

actuator:
  full_steps_per_rev: 200            # From the manual, Sec. 4, Table 2, page 11
  microsteps_per_full_step: 16       # From the manual, Sec. 4, page 11
  max_step_rate_hz: 10000.0          # From the manual, Sec. 6, page 13, worded there as over 10,000 microsteps per second. Nominal, unmeasured on this unit
  max_acceleration_rad_s2: 100.0     # Assumed. Bounded by motor torque, unmeasured on this unit

control:
  loop_rate_hz: 500.0                # From the manual, App. E, Sec. 19
  physics_rate_hz: 1000.0            # Integer multiple of the loop rate

sensing:
  encoder_counts_per_rev: 2400       # From the manual, Table 2, page 11
