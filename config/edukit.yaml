# Physical and interface parameters for the STEVAL-EDUKIT01 rotary inverted pendulum.
#
# The simulation reads its physical constants from this file. A value measured on this unit
# carries the date it was taken and the manual's nominal it replaced. The rest are the
# manual's nominal values for the kit as designed. Experiment 03 measured the unit;
# experiment 04 refitted the loss terms across the full range of swing.

geometry:
  pendulum_length_m: 0.265      # L, measured 2026-08-24. The manual's nominal is 0.258
  rotor_arm_length_m: 0.1145    # r, the radius the pivot sweeps, measured 2026-08-24. The manual's 0.140 is the full arm
  pendulum_mass_kg: 0.02065     # m, weighed before assembly. An upper bound. The 17.05 g tube figure may include the pivot shaft
  gravity_m_s2: 9.806           # From the manual, App. D, Pendulum Dynamics, page 148. Not the standard 9.80665

dynamics:
  normalized_shaft_inertia: 0.0181   # 2*I_shaft/(m*L^2), fitted 2026-08-24 to the measured suspended mode. The manual's nominal is 0.0139
  quality_factor: 28.7               # Q of the suspended oscillation, measured 2026-08-24. The manual's nominal is 20.0
  coulomb_loss_deg_per_half_swing: 0.65   # Dry friction. Experiment 03 fitted 1.07 on small swings alone; experiment 04 refitted it against the full ladder with a drag term
  quadratic_drag_coeff: 0.006             # 1/rad, fitted 2026-09-05 to the large-amplitude ring-down. Torque over inertia is -coeff * |rate| * rate
  friction_crossover_deg: 19.5            # Below this swing, dry friction is the larger loss. Follows from the two terms above

actuator:
  full_steps_per_rev: 200            # From the manual, Sec. 4, Table 2, page 11
  microsteps_per_full_step: 16       # From the manual, Sec. 4, page 11
  max_step_rate_hz: 10000.0          # From the manual, Sec. 6, page 13, worded there as over 10,000 microsteps per second. Nominal, unmeasured on this unit
  max_acceleration_rad_s2: 11.78     # MAX_ACCEL in the supplied firmware, read as microsteps per second squared

control:
  loop_rate_hz: 500.0                # From the manual, App. E, Sec. 19
  physics_rate_hz: 1000.0            # Integer multiple of the loop rate

sensing:
  encoder_counts_per_rev: 2400       # From the manual, Table 2, page 11
