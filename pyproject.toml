[project]
name = "edukit-furuta-pendulum-rl"
version = "0.1.0"
description = "Sim-to-real reinforcement learning for the ST/UCLA Edukit rotary inverted pendulum in NVIDIA Isaac Lab."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Tristan Tibbs", email = "tristantibbs@gmail.com" }]
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "ruff>=0.12",
]
# Bench work only. Needs the physical unit on a serial port, and `st-flash` from the
# stlink package, which is not a Python dependency: `brew install stlink`.
hardware = [
    "pyserial>=3.5",
    "pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "unit: fast, isolated tests with no simulator or hardware",
    "sim: requires a running Isaac Sim",
    "hardware: requires the physical Edukit on a serial port",
]
