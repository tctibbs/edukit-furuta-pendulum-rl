[project]
name = "edukit-furuta-pendulum-rl"
version = "0.1.0"
description = "Sim-to-real reinforcement learning for the ST/UCLA Edukit rotary inverted pendulum in NVIDIA Isaac Lab."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Tristan Tibbs", email = "tristantibbs@gmail.com" }]
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "ruff>=0.12",
]
# Bench work only. Needs the physical unit on a serial port, and `st-flash` from the
# stlink package, which is not a Python dependency: `brew install stlink`.
hardware = [
    "pyserial>=3.5",
    "pyyaml>=6.0",
]

[tool.uv]
package = false

# Simulation stack, pinned to what was verified working on the training host.
# Deliberately not a pip extra. These packages come from three different indexes and must be
# installed in a specific order, so a single `pip install .[sim]` produces an environment that
# imports cleanly and trains on CPU, or crashes on an ABI mismatch. Recording them as data
# rather than as a resolvable extra keeps that trap out of the repo.
# Install procedure and the reasoning behind the ordering: docs/runbooks/training-host-setup.md
[tool.furuta.simulation-stack]
python = "3.11"
isaacsim = "5.1.0"                  # extras [all,extscache], from https://pypi.nvidia.com
isaaclab = "v2.3.2"                 # git tag, commit 37ddf62. Editable installs from source/
torch = "2.7.0+cu128"               # also torchvision 0.22.0+cu128, torchaudio 2.7.0+cu128
tensordict = "0.8.3"                # must match the torch build, see runbook
setuptools = "<81"                  # 81 removed pkg_resources, which flatdict's build needs

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "unit: fast, isolated tests with no simulator or hardware",
    "sim: requires a running Isaac Sim",
    "hardware: requires the physical Edukit on a serial port",
]
