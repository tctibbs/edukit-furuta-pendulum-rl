exclude: ^docs/reference/

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.11
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      # The reference pack is git-ignored and large. This catches a stray
      # commit of a manual, a firmware zip, or a training checkpoint.
      - id: check-added-large-files
        args: [--maxkb=2048]

  # Documentation house style.
  - repo: local
    hooks:
      - id: no-em-dashes
        name: no em dashes or en dashes
        entry: '[—–]'
        language: pygrep
        types: [markdown]

      - id: no-marketing-language
        name: no marketing language
        # Deliberately short. "robust" is excluded: robustness is a real
        # property of a control policy and is used correctly here.
        entry: '(?i)\b(seamless|cutting-edge|blazing|effortless|game-chang|revolutionary|state-of-the-art)'
        language: pygrep
        types: [markdown]
